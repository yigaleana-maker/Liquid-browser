name: Build Liquid Browser APK

# Compila el APK de release en la nube (sin Android Studio).
# Se ejecuta solo con cada push, a mano desde Actions (Run workflow) o al subir un tag v*.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      # Si existe el secreto LIQUID_KEYSTORE_BASE64, se firma con tu llave fija.
      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquid.jks"
            echo "LIQUID_KEYSTORE=$RUNNER_TEMP/liquid.jks" >> "$GITHUB_ENV"
          fi

      # El SDK de Android ya viene instalado en los runners ubuntu-latest (ANDROID_HOME)
      - name: Compilar APK de release
        env:
          LIQUID_STORE_PASSWORD: ${{ secrets.LIQUID_STORE_PASSWORD }}
          LIQUID_KEY_ALIAS: ${{ secrets.LIQUID_KEY_ALIAS }}
          LIQUID_KEY_PASSWORD: ${{ secrets.LIQUID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: liquid-browser-apk
          path: app/build/outputs/apk/release/app-release.apk
